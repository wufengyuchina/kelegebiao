<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>可了个嫑</title>

<style>
body{
    margin:0;
    text-align:center;
    background:#f2f2f2;
    font-family:sans-serif;
}

h2{
    margin:10px 0;
}

#game-box{
    position:relative;
    width:400px;
    height:500px;
    margin:10px auto;
    background:#ddd;
    border-radius:15px;
    border:4px solid #fff;
    overflow:hidden;
}

.card{
    position:absolute;
    width:60px;
    height:60px;
    background:white;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow:0 3px 6px rgba(0,0,0,0.2);
    transition:0.15s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:50px;
    height:50px;
    pointer-events:none;
}

.covered{
    filter:brightness(0.5);
    cursor:not-allowed;
}

#slot{
    width:380px;
    height:80px;
    margin:10px auto;
    background:#333;
    border-radius:10px;
    display:flex;
    align-items:center;
    padding:5px;
    border:4px solid #fff;
    overflow:hidden;
}

.slot-img{
    width:45px;
    height:45px;
    margin:2px;
    background:white;
    border-radius:6px;
}
</style>
</head>

<body>

<h2>可了个嫑</h2>

<div id="game-box"></div>
<div id="slot"></div>

<script>
const gameBox=document.getElementById("game-box");
const slotBox=document.getElementById("slot");

const cardFiles=["a.jpg","b.jpg","c.jpg","d.jpg","e.jpg","f.jpg","g.jpg","h.jpg","i.jpg"];

let cards=[];
let slot=[];

function init(){

    let temp=[];

    // 每种9张
    for(let f of cardFiles){
        for(let i=0;i<9;i++){
            temp.push(f);
        }
    }

    cards=temp.map((img,i)=>({
        id:i,
        img:img,
        x:Math.floor(Math.random()*6)*55+30,
        y:Math.floor(Math.random()*7)*55+20,
        layer:Math.floor(Math.random()*3),
        state:0
    }));

    render();
}

function isCovered(c1){
    for(let c2 of cards){
        if(c2.state!==0) continue;
        if(c2.layer<=c1.layer) continue;

        if(Math.abs(c1.x-c2.x)<55 && Math.abs(c1.y-c2.y)<55){
            return true;
        }
    }
    return false;
}

function render(){
    gameBox.innerHTML="";

    cards.forEach((c,i)=>{

        if(c.state!==0) return;

        c.covered=isCovered(c);

        let div=document.createElement("div");
        div.className="card"+(c.covered?" covered":"");

        div.style.left=c.x+"px";
        div.style.top=c.y+"px";
        div.style.zIndex=c.layer*100+i;

        div.innerHTML=`<img src="images111/${c.img}">`;

        div.onclick=()=>{
            if(c.covered) return;
            if(slot.length>=7) return;

            c.state=1;
            slot.push(c.img);

            checkMatch();
            render();
            checkEnd();
        };

        gameBox.appendChild(div);
    });

    slotBox.innerHTML=slot.map(img=>
        `<img class="slot-img" src="images111/${img}">`
    ).join("");
}

function checkMatch(){

    let count={};

    slot.forEach(i=>{
        count[i]=(count[i]||0)+1;
    });

    for(let img in count){
        if(count[img]>=3){

            let removed=0;

            slot=slot.filter(i=>{
                if(i===img && removed<3){
                    removed++;
                    return false;
                }
                return true;
            });

            cards.forEach(c=>{
                if(c.img===img && c.state===1){
                    c.state=2;
                }
            });
        }
    }
}

function checkEnd(){

    if(slot.length>=7){
        setTimeout(()=>{
            alert("可可的巧克力配方丢失啦！再试一次吧！");
            location.reload();
        },100);
    }

    if(cards.every(c=>c.state===2)){
        setTimeout(()=>{
            alert("可可的巧克力配方被你找到啦！你真棒！");
            location.reload();
        },100);
    }
}

init();
</script>

</body>
</html>
